<title>Geoffrey Allen de Rojas</title>

<style>
  :root {
    --bg:        #FAFBFD;
    --surface:   #FFFFFF;
    --ink:       #101725;
    --muted:     #5A6579;
    --faint:     #8B94A5;
    --line:      #E2E7F0;
    --line-soft: #EDF1F7;
    --accent:    #1A4FC4;
    --accent-in: #FFFFFF;
    --accent-wash: #EDF2FE;
    --shadow: 0 1px 2px rgba(16,23,37,.05), 0 12px 32px -18px rgba(16,23,37,.28);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #0B0F16;
      --surface:   #131924;
      --ink:       #ECF0F7;
      --muted:     #9AA5B6;
      --faint:     #6B7688;
      --line:      #232B3A;
      --line-soft: #1B2230;
      --accent:    #7BA4FF;
      --accent-in: #0B0F16;
      --accent-wash: #172238;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -20px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --bg:        #0B0F16;
    --surface:   #131924;
    --ink:       #ECF0F7;
    --muted:     #9AA5B6;
    --faint:     #6B7688;
    --line:      #232B3A;
    --line-soft: #1B2230;
    --accent:    #7BA4FF;
    --accent-in: #0B0F16;
    --accent-wash: #172238;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -20px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px 40px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 38px 26px 26px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }

  .identity {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
  }

  .avatar-ring {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: var(--accent-wash);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .photo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 48% 20%;
    border-radius: 50%;
    user-select: none;
  }

  h1 {
    margin: 0;
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(28px, 7.6vw, 35px);
    line-height: 1.12;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }

  .role {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .verse {
    margin: 4px 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    padding-top: 18px;
    border-top: 1px solid var(--line-soft);
    width: 100%;
  }
  .verse blockquote {
    margin: 0;
    max-width: 30ch;
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 18px;
    line-height: 1.45;
    color: var(--muted);
    text-wrap: pretty;
  }
  .verse cite {
    font-style: normal;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .group { display: flex; flex-direction: column; gap: 8px; }

  .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--faint);
    padding-left: 2px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 58px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    color: inherit;
    text-decoration: none;
    transition: border-color .15s ease, background-color .15s ease, transform .15s ease;
  }
  .row:hover { border-color: var(--accent); background: var(--accent-wash); }
  .row:active { transform: scale(.99); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .row .mark {
    flex: none;
    width: 34px; height: 34px;
    border-radius: 9px;
    background: var(--accent-wash);
    color: var(--accent);
    display: grid;
    place-items: center;
  }
  .row .mark svg { width: 17px; height: 17px; display: block; }

  .row .text { display: flex; flex-direction: column; min-width: 0; }
  .row .name { font-size: 15px; font-weight: 500; }
  .row .sub {
    font-size: 13px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .arrow { margin-left: auto; color: var(--faint); flex: none; }
  .row .arrow svg { width: 16px; height: 16px; display: block; }

  footer {
    text-align: center;
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--faint);
    padding-top: 6px;
    border-top: 1px solid var(--line-soft);
  }
</style>
</head>
